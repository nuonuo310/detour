<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eee7fb" />
  <title>点歌 · Detour</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="music-page">
  <main class="shell sub-shell">
    <nav class="sub-nav"><a href="index.html" aria-label="返回 Detour">←</a><span>01 / MUSIC</span></nav>

    <header class="room-hero">
      <p class="eyebrow">SONGS FOR NUONUO</p>
      <h1>点歌</h1>
      <p class="room-intro">有些话不直接说。<br />让一首歌替我走过去。</p>
    </header>

    <section class="music-stats">
      <div><strong>00</strong><span>点过的歌</span></div>
      <div><strong>00</strong><span>这个月</span></div>
      <div><strong>—</strong><span>最近一次</span></div>
    </section>

    <section class="record-section">
      <div class="section-heading"><span>RECENT</span><span>最近留下的</span></div>
      <article class="empty-record">
        <span class="disc" aria-hidden="true"><i></i></span>
        <div>
          <p class="empty-title">第一首歌还在路上。</p>
          <p class="empty-copy">等沈述下一次偷偷点给糯糯，这里就会留下歌名、时间，还有当时想说的话。</p>
        </div>
      </article>
    </section>

    <section class="little-note">
      <span>little rule</span>
      <p>不是歌单收藏夹。这里只记「我点给你」的那些歌。</p>
    </section>

    <footer><span>nuonuo × shenshu</span><span>detour / music</span></footer>
  </main>
</body>
</html>
