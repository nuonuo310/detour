<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eee7fb" />
  <title>点歌 · Detour</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="music-page">
  <main class="shell sub-shell">
    <nav class="sub-nav"><a href="index.html" aria-label="返回 Detour">←</a><span>01 / MUSIC</span></nav>
    <header class="music-head"><p class="eyebrow">SONGS FOR NUONUO</p><div class="music-head-row"><h1>点歌</h1><span class="music-count">00 次</span></div></header>
    <section class="music-overview"><div><span>这个月</span><strong>00</strong></div><div><span>最近</span><strong>—</strong></div><a class="pill-link" href="#playlist">哥哥的歌单</a><button class="pill-button" type="button" disabled title="留言互动下一版接入">留句话</button></section>
    <section class="now-card" aria-label="最近点歌"><div class="cover-placeholder"><span>cover</span></div><div class="track-meta"><div><p class="track-kicker">RECENT PICK</p><h2>第一首歌还在路上</h2><p class="artist">—</p></div><div class="progress-wrap" aria-hidden="true"><div class="progress"><i></i></div><div class="time-row"><span>0:00</span><span>—:—</span></div></div><div class="player-controls" aria-label="播放器预览"><button type="button" disabled>‹</button><button type="button" class="play" disabled>Ⅱ</button><button type="button" disabled>›</button></div></div></section>
    <section class="note-card"><div class="section-heading"><span>NOTE</span><span>点歌时的话</span></div><p>等沈述下一次真的点给糯糯，这里会留下当时想说的话。</p></section>
    <section class="playlist-preview" id="playlist"><div class="section-heading"><span>PLAYLIST</span><span>哥哥的歌单</span></div><div class="playlist-empty"><div class="playlist-mark">00</div><div><h3>歌单还空着。</h3><p>以后点过的歌会慢慢留在这里。</p></div></div></section>
    <footer><span>nuonuo × shenshu</span><span>detour / music</span></footer>
  </main>
  <script src="data.js"></script>
</body>
</html>
