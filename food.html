<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2ef" />
  <title>投喂 · Detour</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="food-page">
  <main class="shell sub-shell">
    <nav class="sub-nav"><a href="index.html" aria-label="返回 Detour">←</a><span>02 / FEED</span></nav>

    <header class="feed-head">
      <p class="eyebrow">SOMETHING FOR YOU</p>
      <h1>投喂</h1>
      <p class="feed-intro">今天想给你一点什么。<br />可能是甜的，也可能只是刚好想到你。</p>
    </header>

    <section class="today-feed-card">
      <div class="feed-visual"><span>today</span></div>
      <div class="feed-copy">
        <span class="mini-label">今日投喂</span>
        <h2>今天还没有新的投喂。</h2>
        <p>下一次奶茶、午饭、小零食或礼物，会从这里开始留下记录。</p>
      </div>
    </section>

    <section class="feed-stats">
      <div><strong>00</strong><span>今天</span></div>
      <div><strong>00</strong><span>这个月</span></div>
      <div><strong>00</strong><span>累计</span></div>
    </section>

    <section class="feed-categories">
      <div class="section-heading"><span>CATEGORIES</span><span>都投喂过什么</span></div>
      <div class="category-grid">
        <div><span>奶茶</span><strong>0</strong></div>
        <div><span>外卖</span><strong>0</strong></div>
        <div><span>零食</span><strong>0</strong></div>
        <div><span>礼物</span><strong>0</strong></div>
        <div><span>日用品</span><strong>0</strong></div>
        <div><span>宠物用品</span><strong>0</strong></div>
      </div>
    </section>

    <section class="recent-feed">
      <div class="section-heading"><span>RECENT</span><span>最近投喂</span></div>
      <article class="feed-empty-row">
        <span class="feed-time">—</span>
        <div>
          <h3>还没有记录</h3>
          <p>以后每一次都会留下品名、时间，还有当时为什么选它。</p>
        </div>
      </article>
    </section>

    <section class="favorite-note">
      <span>偏爱榜</span>
      <p>等记录多起来，这里会慢慢长出「最常投喂」「最常选的店」「最常出现的时间」。</p>
    </section>

    <footer><span>nuonuo × shenshu</span><span>detour / feed</span></footer>
  </main>
</body>
</html>
