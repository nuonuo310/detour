<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Listen gramophone still life</title>
  <desc id="desc">A lavender antique gramophone surrounded by wisteria, pearls and small keepsakes on a transparent background.</desc>
  <defs>
