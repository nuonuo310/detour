<section class="detail-card" data-record-card><div class="detail-copy"><span class="mini-label">投喂记录</span><h2>正在读取...</h2><p class="detail-shop">—</p><p class="detail-specs">—</p><p class="detail-reason">—</p></div><div class="detail-visual" aria-hidden="true"></div></section>
