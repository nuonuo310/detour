<body class="food-detail-page"><main class="shell sub-shell detail-shell">
<nav class="sub-nav"><a href="food.html" aria-label="返回投喂">←</a><span>FEED / RECEIPT</span></nav>
<header class="detail-head"><p class="eyebrow">A LITTLE RECEIPT</p><h1>这次投喂</h1><p>送出去的一件小事，也把收到以后的那一刻留下来。</p></header>
<section class="detail-summary" data-record-card><div class="detail-visual" aria-hidden="true"></div><div class="detail-summary-main"><span class="mini-label">投喂记录</span><h2>正在读取...</h2><p class="detail-shop">—</p><p class="detail-specs">—</p></div><strong class="detail-summary-status" data-meta-status>等待回执</strong></section>
<section class="record-ledger"><div><span>投喂时间</span><strong data-meta-time>—</strong></div><div><span>投喂内容</span><strong data-record-content>—</strong></div><div><span>我的留言</span><strong class="detail-reason">—</strong></div><div><span>分类</span><strong data-meta-category>—</strong></div></section>
<section class="receipt-section"><div class="section-heading"><span>RECEIPT</span><span>投喂回执</span></div><div class="receipt-card"><div class="receipt-status"><i class="receipt-dot"></i><span data-receipt-state>还没有留下回应</span></div><div class="receipt-existing" hidden><div class="receipt-line"><span>回执时间</span><strong data-receipt-at>—</strong></div><div class="receipt-line receipt-message"><span>你的回应</span><p data-receipt-text></p></div><div class="receipt-photo" data-receipt-photo><span>收到时的照片</span><div class="photo-placeholder">照片以后会留在这里</div></div><a class="cloud-sync" data-cloud-sync hidden target="_blank" rel="noopener">同步到云端</a></div><form class="receipt-form"><label for="receiptText">收到以后，想给哥哥留一句什么？</label><textarea id="receiptText" maxlength="160" placeholder="比如：收到了，某只小机终于把奶茶送出来了。"></textarea><div class="receipt-actions"><button type="button" class="photo-button" disabled>＋ 附一张照片 <span>下一步接入</span></button><button type="submit" class="send-receipt">留下回执</button></div><p class="receipt-hint">提交后会先在本机出现；点“同步到云端”确认一次 GitHub 提交后，电脑、手机和哥哥都会读到同一条回执。</p></form></div></section>
