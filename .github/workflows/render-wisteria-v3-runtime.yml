name: Render wisteria v3 runtime

on:
  push:
    branches:
      - visual-v2-day-wisteria-v3-runtime
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact overlay branch
        uses: actions/checkout@v4
        with:
          ref: visual-v2-day-wisteria-overlay-test

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install renderer
        run: npm install --no-save puppeteer-core@24

      - name: Serve repo
        run: |
          python3 -m http.server 4173 > /tmp/detour-http.log 2>&1 &
          sleep 2

      - name: Render exact review page in Chromium
        run: |
          cat > render-runtime.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({
            executablePath:process.env.CHROME_PATH,
            headless:true,
            args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']
          });
          const page=await browser.newPage();
          await page.setViewport({width:1280,height:1600,deviceScaleFactor:1});
          await page.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'}]);
          page.on('pageerror',e=>console.error('PAGEERROR',e.message));
          page.on('response',r=>{if(r.status()>=400)console.error('HTTPERR',r.status(),r.url())});
          const url='http://127.0.0.1:4173/prototype/detour-v2-day-lobby-background-review.html';
          const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:15000});
          console.log('HTTP',res?.status());
          await page.waitForSelector('#detourV2',{timeout:15000});
          await page.waitForSelector('.dv2-lobby',{timeout:15000});
          await page.evaluate(()=>{
            const lobby=document.querySelector('.dv2-lobby');
            for(const s of document.querySelectorAll('.dv2-scene')) s.hidden=s!==lobby;
          });
          await page.waitForSelector('.dv2-lobby-wisteria-overlay',{visible:true,timeout:15000});
          await page.waitForFunction(()=>{
            const i=document.querySelector('.dv2-lobby-wisteria-overlay');
            return i&&i.complete&&i.naturalWidth>0;
          },{timeout:15000});
          await new Promise(r=>setTimeout(r,2500));
          const info=await page.evaluate(()=>{
            const i=document.querySelector('.dv2-lobby-wisteria-overlay');
            const l=document.querySelector('.dv2-lobby');
            return {
              src:i?.getAttribute('src'),naturalWidth:i?.naturalWidth,naturalHeight:i?.naturalHeight,
              opacity:i?getComputedStyle(i).opacity:null,lobbyHidden:l?.hidden??null,
              listenReady:document.documentElement.classList.contains('detour-listen-day-v1'),
              readReady:document.documentElement.classList.contains('detour-read-day-v2'),
              giftsReady:document.documentElement.classList.contains('detour-gifts-day-v1'),
              feedingReady:document.documentElement.classList.contains('detour-feeding-day-v1'),
              gamesReady:document.documentElement.classList.contains('detour-games-day-v1'),
              datesReady:document.documentElement.classList.contains('detour-dates-day-v1'),
              foxReady:[...document.documentElement.classList].some(c=>c.startsWith('detour-fox-day'))
            };
          });
          console.log('RUNTIME_INFO',JSON.stringify(info));
          if(!info.src?.includes('detour-wisteria-full-atmosphere-overlay-v3.png')) throw new Error('wrong wisteria source');
          if(info.opacity!=='1') throw new Error('wisteria opacity not 1');
          if(!info.naturalWidth||!info.naturalHeight) throw new Error('wisteria image did not load');
          if(!(info.listenReady&&info.readReady&&info.giftsReady&&info.feedingReady&&info.gamesReady&&info.datesReady&&info.foxReady)) throw new Error('one or more frozen lobby layers did not initialize');
          const lobby=await page.$('.dv2-lobby');
          await lobby.screenshot({path:'detour-wisteria-v3-runtime.png',captureBeyondViewport:true});
          console.log('SHOT_DONE');
          await browser.close();
          EOF
          CHROME_PATH="$(which google-chrome)" timeout 70s node render-runtime.mjs
          test -s detour-wisteria-v3-runtime.png

      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: detour-wisteria-v3-runtime-render
          path: detour-wisteria-v3-runtime.png
          if-no-files-found: error
