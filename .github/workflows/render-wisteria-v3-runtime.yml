name: Render wisteria v3 runtime

on:
  push:
    branches:
      - visual-v2-day-wisteria-v3-runtime
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact overlay branch
        uses: actions/checkout@v4
        with:
          ref: visual-v2-day-wisteria-overlay-test

      - name: Assemble isolated lobby render
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototype/detour-v2-three-screen.html')
          html=p.read_text(encoding='utf-8')
          head='''<link rel="stylesheet" href="../assets/v2/detour-responsive-composition.css"><link rel="stylesheet" href="../assets/v2/detour-art-slots.css"><link rel="stylesheet" href="../assets/v2/detour-lobby-background-test.css"><link rel="stylesheet" href="../assets/v2/detour-wisteria-overlay-review.css">'''
          body='''<script src="../assets/v2/detour-wisteria-overlay-review.js"></script>'''
          html=html.replace('</head>',head+'</head>').replace('</body>',body+'</body>')
          Path('prototype/runtime-wisteria-only.html').write_text(html,encoding='utf-8')
          print('ASSEMBLED', 'id="detourV2"' in html, 'dv2-lobby' in html, len(html.encode('utf-8')))
          PY

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install renderer
        run: npm install --no-save puppeteer-core@24

      - name: Serve repo
        run: |
          python3 -m http.server 4173 > /tmp/detour-http.log 2>&1 &
          sleep 2

      - name: Render isolated wisteria lobby in Chromium
        run: |
          cat > render-wisteria.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
          page.on('pageerror',e=>console.error('PAGEERROR',e.message));
          page.on('response',r=>{if(r.status()>=400)console.error('HTTPERR',r.status(),r.url())});
          const res=await page.goto('http://127.0.0.1:4173/prototype/runtime-wisteria-only.html',{waitUntil:'domcontentloaded',timeout:20000});
          console.log('HTTP',res?.status());
          await page.waitForSelector('#detourV2',{timeout:10000});
          await page.evaluate(()=>{
            const lobby=document.querySelector('.dv2-lobby');
            for(const s of document.querySelectorAll('.dv2-scene')) s.hidden=s!==lobby;
            if(lobby){lobby.hidden=false; lobby.style.minHeight='900px';}
          });
          await page.waitForSelector('.dv2-lobby-wisteria-overlay',{visible:true,timeout:10000});
          await page.waitForFunction(()=>{const i=document.querySelector('.dv2-lobby-wisteria-overlay');return i&&i.complete&&i.naturalWidth>0},{timeout:10000});
          const info=await page.evaluate(()=>{const i=document.querySelector('.dv2-lobby-wisteria-overlay');return {src:i?.getAttribute('src'),w:i?.naturalWidth,h:i?.naturalHeight,opacity:i?getComputedStyle(i).opacity:null};});
          console.log('WISTERIA_INFO',JSON.stringify(info));
          if(!info.src?.includes('detour-wisteria-full-atmosphere-overlay-v3.png')) throw new Error('wrong source');
          if(info.opacity!=='1') throw new Error('opacity not 1');
          if(!info.w||!info.h) throw new Error('image missing');
          const lobby=await page.$('.dv2-lobby');
          await lobby.screenshot({path:'detour-wisteria-v3-isolated-runtime.png'});
          await browser.close();
          EOF
          CHROME_PATH="$(which google-chrome)" timeout 45s node render-wisteria.mjs
          test -s detour-wisteria-v3-isolated-runtime.png

      - name: Upload isolated render
        uses: actions/upload-artifact@v4
        with:
          name: detour-wisteria-v3-isolated-runtime
          path: detour-wisteria-v3-isolated-runtime.png
          if-no-files-found: error
