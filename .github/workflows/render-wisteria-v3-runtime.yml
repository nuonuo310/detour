name: Render wisteria v3 runtime

on:
  push:
    branches:
      - visual-v2-day-wisteria-v3-runtime
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact overlay branch
        uses: actions/checkout@v4
        with:
          ref: visual-v2-day-wisteria-overlay-test

      - name: Assemble exact review document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototype/detour-v2-three-screen.html')
          html=p.read_text(encoding='utf-8')
          head='''<link rel="stylesheet" href="../assets/v2/detour-responsive-composition.css"><link rel="stylesheet" href="../assets/v2/detour-art-slots.css"><link rel="stylesheet" href="../assets/v2/detour-listen-day.css"><link rel="stylesheet" href="../assets/v2/detour-read-day.css"><link rel="stylesheet" href="../assets/v2/detour-gifts-day.css"><link rel="stylesheet" href="../assets/v2/detour-feeding-day.css"><link rel="stylesheet" href="../assets/v2/detour-games-day.css"><link rel="stylesheet" href="../assets/v2/detour-dates-day.css"><link rel="stylesheet" href="../assets/v2/detour-fox-day.css"><link rel="stylesheet" href="../assets/v2/detour-lobby-background-test.css"><link rel="stylesheet" href="../assets/v2/detour-wisteria-overlay-review.css">'''
          body='''<script src="../assets/v2/detour-illustration-upgrade.js"></script><script src="../assets/v2/detour-listen-day.js"></script><script src="../assets/v2/detour-read-day.js"></script><script src="../assets/v2/detour-gifts-day.js"></script><script src="../assets/v2/detour-feeding-day.js"></script><script src="../assets/v2/detour-games-day.js"></script><script src="../assets/v2/detour-dates-day.js"></script><script src="../assets/v2/detour-fox-day.js"></script><script src="../assets/v2/detour-wisteria-overlay-review.js"></script>'''
          html=html.replace('</head>',head+'</head>').replace('</body>',body+'</body>')
          Path('prototype/runtime-review.html').write_text(html,encoding='utf-8')
          print('ASSEMBLED_HAS_DETOUR', '#detourV2' in html, 'id="detourV2"' in html)
          print('ASSEMBLED_BYTES', len(html.encode('utf-8')))
          PY

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install renderer
        run: npm install --no-save puppeteer-core@24

      - name: Serve repo
        run: |
          python3 -m http.server 4173 > /tmp/detour-http.log 2>&1 &
          sleep 2

      - name: Capture Chromium diagnostics
        run: |
          cat > diagnose-runtime.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          await page.setViewport({width:1280,height:1600,deviceScaleFactor:1});
          page.on('console',m=>console.log('BROWSER_CONSOLE',m.type(),m.text()));
          page.on('pageerror',e=>console.error('PAGEERROR',e.stack||e.message));
          page.on('requestfailed',r=>console.error('REQFAIL',r.url(),r.failure()?.errorText));
          page.on('response',r=>{if(r.status()>=400)console.error('HTTPERR',r.status(),r.url())});
          const url='http://127.0.0.1:4173/prototype/runtime-review.html';
          const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:20000});
          console.log('HTTP',res?.status(),'URL',page.url());
          await new Promise(r=>setTimeout(r,3500));
          const html=await page.content();
          fs.writeFileSync('chromium-page.html',html);
          const diag=await page.evaluate(()=>({
            title:document.title,
            readyState:document.readyState,
            bodyLength:document.body?.innerHTML.length ?? -1,
            bodyStart:(document.body?.innerHTML||'').slice(0,1200),
            hasDetour:!!document.querySelector('#detourV2'),
            ids:[...document.querySelectorAll('[id]')].slice(0,30).map(n=>n.id),
            scripts:[...document.scripts].map(s=>s.src||'[inline]').slice(-20),
            links:[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.href).slice(-20)
          }));
          console.log('DIAG',JSON.stringify(diag));
          await page.screenshot({path:'chromium-page.png',fullPage:true});
          await browser.close();
          EOF
          CHROME_PATH="$(which google-chrome)" timeout 60s node diagnose-runtime.mjs

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detour-wisteria-v3-runtime-diagnostics
          path: |
            chromium-page.html
            chromium-page.png
          if-no-files-found: error
