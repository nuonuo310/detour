name: Validate Detour Data

on:
  push:
    branches:
      - dev
    paths:
      - 'data/**'
      - 'tools/append-event.mjs'
      - 'tools/validate-data.mjs'
  pull_request:
    paths:
      - 'data/**'
      - 'tools/append-event.mjs'
      - 'tools/validate-data.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Detour data
        run: node tools/validate-data.mjs
