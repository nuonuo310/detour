name: Meituan Preview Spike Smoke

on:
  workflow_dispatch:
  push:
    branches: [meituan-preview-spike]
    paths:
      - 'tools/meituan-preview-*'
      - 'package.json'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run meituan:preview:smoke
