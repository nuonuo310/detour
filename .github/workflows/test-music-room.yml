name: Test music room

on:
  push:
    branches:
      - dev
      - mcp-room-read-spike
    paths:
      - 'music-room-*.js'
      - 'music-song-search*.js'
      - 'cloudflare/music-room-*.js'
      - 'tests/music-room-*.test.js'
      - 'tools/test-music-*.mjs'
      - 'package.json'
      - '.github/workflows/test-music-room.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'music-room-*.js'
      - 'music-song-search*.js'
      - 'cloudflare/music-room-*.js'
      - 'tests/music-room-*.test.js'
      - 'tools/test-music-*.mjs'
      - 'package.json'
      - '.github/workflows/test-music-room.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:music-room
      - run: npm run test:music-search
