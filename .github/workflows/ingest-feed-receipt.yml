name: Ingest Feed Receipt

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[feed-receipt]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Append receipt
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const body = process.env.ISSUE_BODY || '';
          const match = body.match(/<!--\s*detour-receipt:([\s\S]*?)\s*-->/);
          if (!match) throw new Error('missing detour receipt payload');
          const receipt = JSON.parse(decodeURIComponent(match[1].trim()));
          if (!receipt.foodId || !receipt.text || !receipt.createdAt) throw new Error('invalid receipt payload');
          const path = 'data/food-receipts.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          data.receipts = Array.isArray(data.receipts) ? data.receipts : [];
          const existing = data.receipts.findIndex(r => r.foodId === receipt.foodId);
          const clean = {
            id: String(receipt.id || `receipt-${Date.now()}`),
            foodId: String(receipt.foodId),
            text: String(receipt.text).slice(0, 500),
            photo: receipt.photo || null,
            createdAt: String(receipt.createdAt),
            readByShenshu: false,
            readAt: null,
            source: 'github-issue'
          };
          if (existing >= 0) data.receipts[existing] = clean;
          else data.receipts.unshift(clean);
          data.updatedAt = new Date().toISOString();
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Commit receipt
        run: |
          git config user.name "detour-receipt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/food-receipts.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: ingest feed receipt #${{ github.event.issue.number }}"
          git push origin main
      - name: Close handoff issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Receipt synced to Detour cloud data."
