<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detour · Cloud Together Listening Demo</title>
  <style>
    body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px}button,input,select{font:inherit}button{margin:4px;padding:8px 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{padding:16px;border:1px solid #ccc;border-radius:12px;margin:16px 0}.muted{opacity:.65;font-size:14px}input[type=range]{width:280px}input[type=url]{min-width:420px;max-width:100%;flex:1}
  </style>
</head>
<body>
  <h1>Together Listening · Cloud Acceptance</h1>
  <p class="muted">After deploying the room Worker, open this page on two devices, use the same room URL and different clients, then control either side.</p>
  <div class="row">
    <input id="url" type="url" placeholder="wss://your-worker.workers.dev/music-room/detour-together-demo">
    <select id="client"><option value="shenshu">Shenshu</option><option value="nuonuo">Nuonuo</option></select>
    <button id="connect">Connect</button>
  </div>
  <div class="status">
    <div id="connection">Disconnected</div>
    <div id="song">No song</div>
    <div id="state">Paused · 0.0s</div>
    <div id="revision" class="muted">revision 0</div>
  </div>
  <div class="row">
    <button id="songA">Song A</button><button id="songB">Song B</button>
    <button id="play">Play</button><button id="pause">Pause</button>
  </div>
  <div class="row"><input id="seek" type="range" min="0" max="300" value="0" step="1"><button id="seekButton">Seek</button></div>
  <script type="module" src="music-room-cloud-demo.js"></script>
</body>
</html>
